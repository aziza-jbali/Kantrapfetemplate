<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Page</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen p-8">

  <div class="grid md:grid-cols-2 gap-8 w-full max-w-6xl">
    
    <!-- Left Side: Car Info -->
    <div class="bg-gray-900 rounded-2xl shadow-lg overflow-hidden">
      <img src="https://images.unsplash.com/photo-1601933470928-cd3a8ddaa7d8?auto=format&fit=crop&w=800&q=80" 
           alt="Car" class="w-full h-64 object-cover">
      
      <div class="p-6">
        <h2 class="text-2xl font-bold text-yellow-500">Hyundai i20</h2>
        <p class="text-green-400 text-xl mt-2">$50 / day</p>
        
        <!-- Car Features -->
        <div class="grid grid-cols-4 gap-4 mt-6 text-center">
          <div>
            <p class="text-lg font-bold">4</p>
            <p class="text-gray-400 text-sm">Seats</p>
          </div>
          <div>
            <p class="text-lg font-bold">Petrol</p>
            <p class="text-gray-400 text-sm">Fuel</p>
          </div>
          <div>
            <p class="text-lg font-bold">20km/l</p>
            <p class="text-gray-400 text-sm">Mileage</p>
          </div>
          <div>
            <p class="text-lg font-bold">Auto</p>
            <p class="text-gray-400 text-sm">Gear</p>
          </div>
        </div>

        <!-- About -->
        <div class="bg-gray-800 rounded-lg p-4 mt-6">
          <h3 class="text-lg font-semibold">About this car</h3>
          <p class="text-gray-300 text-sm mt-2">
            The Hyundai i20 is a comfortable and fuel-efficient compact car, 
            perfect for city driving and long trips.
          </p>
        </div>
      </div>
    </div>

    <!-- Right Side: Booking Form -->
    <div class="bg-gray-900 rounded-2xl shadow-lg p-6">
      <h2 class="text-2xl font-bold">
        Reserve <span class="text-yellow-500">Your Drive</span>
      </h2>
      <p class="text-gray-400 text-sm mb-6">Fast - Secure - Easy</p>

      <form class="space-y-4">
        <!-- Dates -->
        <div class="grid grid-cols-2 gap-4">
          <div class="flex items-center bg-gray-800 rounded-lg p-2">
            <i class="fa fa-calendar text-yellow-400 mr-2"></i>
            <input type="date" class="bg-transparent w-full focus:outline-none">
          </div>
          <div class="flex items-center bg-gray-800 rounded-lg p-2">
            <i class="fa fa-calendar text-yellow-400 mr-2"></i>
            <input type="date" class="bg-transparent w-full focus:outline-none">
          </div>
        </div>

        <!-- Pickup Location -->
        <div class="flex items-center bg-gray-800 rounded-lg p-2">
          <i class="fa fa-map-marker-alt text-yellow-400 mr-2"></i>
          <input type="text" placeholder="Pickup Location" class="bg-transparent w-full focus:outline-none">
        </div>

        <!-- Full Name -->
        <div class="flex items-center bg-gray-800 rounded-lg p-2">
          <i class="fa fa-user text-yellow-400 mr-2"></i>
          <input type="text" placeholder="Full Name" class="bg-transparent w-full focus:outline-none">
        </div>

        <!-- Email & Phone -->
        <div class="grid grid-cols-2 gap-4">
          <div class="flex items-center bg-gray-800 rounded-lg p-2">
            <i class="fa fa-envelope text-yellow-400 mr-2"></i>
            <input type="email" placeholder="Email" class="bg-transparent w-full focus:outline-none">
          </div>
          <div class="flex items-center bg-gray-800 rounded-lg p-2">
            <i class="fa fa-phone text-yellow-400 mr-2"></i>
            <input type="tel" placeholder="Phone" class="bg-transparent w-full focus:outline-none">
          </div>
        </div>

        <!-- City / State / Zip -->
        <div class="grid grid-cols-3 gap-4">
          <div class="flex items-center bg-gray-800 rounded-lg p-2">
            <i class="fa fa-city text-yellow-400 mr-2"></i>
            <input type="text" placeholder="City" class="bg-transparent w-full focus:outline-none">
          </div>
          <div class="flex items-center bg-gray-800 rounded-lg p-2">
            <input type="text" placeholder="State" class="bg-transparent w-full focus:outline-none">
          </div>
          <div class="flex items-center bg-gray-800 rounded-lg p-2">
            <input type="text" placeholder="Zip" class="bg-transparent w-full focus:outline-none">
          </div>
        </div>

        <!-- Price Summary -->
        <div class="flex justify-between mt-4">
          <span class="font-semibold">Price</span>
          <span>$50</span>
        </div>
        <div class="flex justify-between">
          <span class="font-bold">Total</span>
          <span class="font-bold">$100</span>
        </div>

        <!-- Button -->
        <button type="submit" 
                class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-lg">
          Book Now
        </button>
      </form>
    </div>

  </div>
</body>
</html>
